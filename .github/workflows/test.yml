name: 🛡️ kendo_os リリース品質ゲート自動監査要塞

on:
  push:
    branches: [ main, stage2-beta ]
  pull_request:
    branches: [ main, stage2-beta ]

jobs:
  quality-gate:
    name: Release Quality Gate & Multi-Layer Governance
    runs-on: ubuntu-latest
    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Python環境の構築
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📏 ファイル行数ガバナンス監査 (500行上限の厳格チェック)
        run: python3 scripts/check_file_lines.py

      - name: 🎨 デザインシステム ガバナンス監査 (18項目100%遵守)
        run: python3 scripts/check_design_tokens.py --strict

      - name: 🚀 Flutter安定版環境の構築
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 依存パッケージの解決
        run: flutter pub get

      - name: 🧹 Dartコード・警告の全自動修復 (自動フォーマット & リント修復)
        run: |
          dart fix --apply
          dart format .

      - name: 🔍 静的解析空間の厳格監査 (Red Error保護)
        run: flutter analyze --no-fatal-infos

      - name: 🧪 全要塞テストの一斉自動実行＆カバレッジ計測（Unit / Widget / Golden / E2E）
        run: flutter test --coverage

      - name: 📸 ゴールデン画像の最終自動検証（手動見逃しの物理排除）
        run: flutter test --update-goldens

      - name: ⚙️ Node.js環境の構築 (Cloud Functions 用)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Cloud Functions 依存パッケージの解決
        run: npm ci
        working-directory: ./functions

      - name: 🧪 Cloud Functions 自動ユニットテスト (Jest)
        run: npm test
        working-directory: ./functions
