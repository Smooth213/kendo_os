name: 🛡️ kendo_os リリース品質ゲート自動監査要塞

on:
  push:
    branches: [ main, stage2-beta ]
  pull_request:
    branches: [ main, stage2-beta ]

jobs:
  # 🔍 STEP 1: 静的解析・ガバナンス監査（最速1分で完了・構文/型エラーを即座に検知）
  static-analysis:
    name: 🔍 Firebase & Flutter 静的解析＆ガバナンス監査 (Fast-Fail)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Python環境の構築
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: ⚙️ Node.js環境の構築 (Cloud Functions 用)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🚀 Flutter安定版環境の構築
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Flutter 依存パッケージの解決
        run: flutter pub get

      - name: 📦 Cloud Functions 依存パッケージの解決
        run: npm ci
        working-directory: ./functions

      - name: 🧹 [1/4] Dartコード・警告の全自動修復 (自動フォーマット & リント修復)
        run: |
          dart fix --apply
          dart format .

      - name: 🛡️ [2/4] 全31大ガバナンス法典 統合監査 (Unified Governance Runner 1/31 〜 31/31)
        run: python3 scripts/run_all_governance.py

      - name: 🔍 [3/4] Flutter 静的解析空間の厳格監査 (Red Error保護)
        run: flutter analyze --no-fatal-infos

      - name: ⚙️ [4/4] Firebase Cloud Functions 自動ユニットテスト (Jest)
        run: npm test
        working-directory: ./functions

  # ⚡ STEP 2: テスト要塞の8並列 Sharding 実行（ラウンドロビン均等分散 ＆ 2コア並列）
  test-shards:
    name: 🧪 テスト要塞並列実行 (Shard ${{ matrix.shard-index }}/${{ matrix.total-shards }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        total-shards: [8]
        shard-index: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 🚀 Flutter安定版環境の構築
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 依存パッケージの解決
        run: flutter pub get

      - name: 🗄️ Isar Core バイナリキャッシュ復元
        id: isar-cache
        uses: actions/cache@v4
        with:
          path: libisar.so
          key: isar-binary-linux-x64-3.3.2

      - name: 🗄️ Isar Core バイナリ事前配置 (Linux x64 CI安定化・耐障害多重リトライ)
        run: |
          if [ ! -s libisar.so ] || [ $(wc -c < libisar.so 2>/dev/null || echo 0) -lt 1000000 ]; then
            echo "📥 libisar.so をダウンロードします（同時アクセス分散ジッター適用）..."
            # 8並列シャードの同時アクセス集中による Connection reset を防ぐため、シャードごとに待機時間を分散
            sleep $(( (${{ matrix.shard-index }} * 2) + (RANDOM % 3) + 1 ))
            
            # リトライ付きcurl（接続タイムアウト15秒、リトライ5回、全エラー対象）
            curl --connect-timeout 15 --max-time 120 --retry 5 --retry-delay 3 --retry-all-errors -fsSL \
              https://binaries.isar-community.dev/3.3.2/libisar_linux_x64.so -o libisar.so || true
          fi

          if [ -s libisar.so ]; then
            cp libisar.so libisar_linux_x64.so
            sudo cp libisar.so /usr/lib/libisar.so || true
            sudo cp libisar.so /usr/lib/libisar_linux_x64.so || true
            sudo cp libisar.so /usr/lib/x86_64-linux-gnu/libisar.so || true
            sudo cp libisar.so /usr/lib/x86_64-linux-gnu/libisar_linux_x64.so || true
            sudo cp libisar.so /usr/local/lib/libisar.so || true
            sudo ldconfig || true
            echo "🟢 libisar.so の配置とldconfigが完了しました"
          else
            echo "⚠️ libisar.so の事前配置に失敗しましたが、テスト実行時フォールバックへ進みます"
          fi

      - name: ⚡ Sharded Test Execution (Shard ${{ matrix.shard-index }}/${{ matrix.total-shards }})
        env:
          LD_LIBRARY_PATH: .:${{ github.workspace }}:/usr/lib:/usr/lib/x86_64-linux-gnu:/usr/local/lib
        run: python3 scripts/run_ci_shard.py ${{ matrix.shard-index }} ${{ matrix.total-shards }}

