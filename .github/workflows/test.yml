name: 🛡️ kendo_os リリース品質ゲート自動監査要塞

on:
  push:
    branches: [ main, stage2-beta ]
  pull_request:
    branches: [ main, stage2-beta ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🚀 Flutter安定版環境の構築
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 依存パッケージの解決
        run: flutter pub get

      - name: 🔍 静的解析空間の厳格監査（警告ゼロ縛り）
        run: flutter analyze

      - name: 🧪 全要塞テストの一斉自動実行＆カバレッジ計測（Unit / Widget / Golden / E2E）
        run: flutter test --coverage

      - name: 📸 ゴールデン画像の最終自動検証（手動見逃しの物理排除）
        run: flutter test --update-goldens
