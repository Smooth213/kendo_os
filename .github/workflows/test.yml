name: 🛡️ kendo_os リリース品質ゲート自動監査要塞

on:
  push:
    branches: [ main, stage2-beta ]
  pull_request:
    branches: [ main, stage2-beta ]

jobs:
  # 🔍 STEP 1: 静的解析・ガバナンス監査（最速1分で完了・構文/型エラーを即座に検知）
  static-analysis:
    name: 🔍 静的解析＆ガバナンス監査 (Fast-Fail)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Python環境の構築
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📏 ファイル行数ガバナンス監査 (500行上限の厳格チェック)
        run: python3 scripts/check_file_lines.py

      - name: 🎨 デザインシステム ガバナンス監査 (18項目100%遵守)
        run: python3 scripts/check_design_tokens.py --strict

      - name: 🚀 Flutter安定版環境の構築
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 依存パッケージの解決
        run: flutter pub get

      - name: 🧹 Dartコード・警告の全自動修復 (自動フォーマット & リント修復)
        run: |
          dart fix --apply
          dart format .

      - name: 🔍 静的解析空間の厳格監査 (Red Error保護)
        run: flutter analyze --no-fatal-infos

  # ⚡ STEP 2: テスト要塞の4並列 Sharding 実行（16分超 ➔ 約4分へ劇的短縮）
  test-shards:
    name: 🧪 テスト要塞並列実行 (Shard ${{ matrix.shard-index }}/${{ matrix.total-shards }})
    runs-on: ubuntu-latest
    needs: [static-analysis]
    strategy:
      fail-fast: false
      matrix:
        total-shards: [4]
        shard-index: [0, 1, 2, 3]
    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 🚀 Flutter安定版環境の構築
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 依存パッケージの解決
        run: flutter pub get

      - name: ⚡ Sharded Test Execution (Shard ${{ matrix.shard-index }}/${{ matrix.total-shards }})
        run: flutter test --total-shards ${{ matrix.total-shards }} --shard-index ${{ matrix.shard-index }}

  # ⚙️ STEP 3: Cloud Functions 自動テスト
  cloud-functions:
    name: ⚙️ Cloud Functions 自動テスト (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: ⚙️ Node.js環境の構築 (Cloud Functions 用)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Cloud Functions 依存パッケージの解決
        run: npm ci
        working-directory: ./functions

      - name: 🧪 Cloud Functions 自動ユニットテスト (Jest)
        run: npm test
        working-directory: ./functions
