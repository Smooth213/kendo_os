<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kendo OS Viewer">

  <script src="https://unpkg.com/isar@3.0.0-dev.14/dist/index.js"></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kendo_os">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kendo_os</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // =========================================================================
    // 🛡️ Phase 3 - STEP 3-2 要件：Service Workerアセットキャッシュの強化
    // アプリのコア（JS、フォント、アイコン）は完全ローカルキャッシュしオフライン起動を保証。
    // 重量データであるPDF、画像、およびFirestoreの動的クエリパケットの混入はブラウザクラッシュを防ぐため厳格に禁止。
    // =========================================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=1', {
          scope: '.'
        }).then(function (reg) {
          console.log('🛡️ [PWA ServiceWorker] 体育館オフライン防衛アセットキャッシュが有効です。');
        }).catch(function (err) {
          console.error('⚠️ [PWA ServiceWorker] 登録失敗:', err);
        });
      });
    }
  </script>
  <!-- ★ 修正: 絶対パスに変更し、深いURLからでも確実にロードできるようにする（ホワイトアウト対策4） -->
  <script src="/flutter_bootstrap.js" async></script>
</body>
</html>
