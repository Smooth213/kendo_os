  <meta charset="UTF-8">

  <!-- 🌐 iOS PWA 最適化スタイル -->
  <style>
    html, body {
      height: 100%;
      height: 100dvh; /* Mobile Safari / Chrome アドレスバー伸縮対応 */
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior-y: none; /* Safari オーバースクロールバウンス完全防止 */
      touch-action: manipulation; /* 連打操作時の誤ズームを完全遮断 */
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      background-color: #000000;
    }
  </style>

  <!-- iOS meta tags & icons -->

  <!-- 🛡️ iOS PWA フルスクリーン最適化（TouchSyncステルス補正併用） -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Syncfusion Flutter PDF Viewer for Web (Updated to 3.11.174 to match plugin v28) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    var pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 🌐 【Phase 7】IndexedDB 永続化保護（Safari 7日間データ消滅対策）
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(function (persistent) {
        console.log('💾 [StorageManager] IndexedDB 永続化保護:', persistent);
      });
    }

    // 🌐 【Phase 7】Chrome / Safari BFCache（戻る・進むキャッシュ）復帰最適化
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        console.log('🔄 [BFCache] ページキャッシュから瞬時復帰しました。');
      }
    });
  </script>

  <script>
    // =========================================================================
    // 🛡️ Kendo OS: iOS PWA WebKit 起動直後タッチ座標56pxズレ 完全物理根絶システム (v3.0 Stealth)
    //
    // 【真因と解決メカニズム】
    // 1. iOS PWA / Safari 起動時、WebKit 内部の UIScrollView がステータスバー分（54px/47px）
    //    インセットされたまま初期化がフリーズし、未同期の間すべてのタッチイベントの clientY に誤加算される。
    // 2. WebKit の元の MouseEvent.prototype.clientY getter から直接生の値（rawY）を抽出し、
    //    多重減算を物理的に防ぎながら fixedY = rawY - statusBarHeight を厳密に適用。
    // 3. ユーザーの実際の指スワイプ（移動量 > 10px）のみで正規化完了（isSynced = true）と判定。
    //    （※ 起動時の resize や初期 scroll による誤解除を完全排除）
    // 4. UIデザインを一切汚さない完全ステルス動作（HUD非表示）。
    // =========================================================================
    (function () {
      var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (!isIos) return; // iOS 以外は完全バイパス

      // 1. ステータスバー高さの正確な計測
      function getStatusBarHeight() {
        try {
          var probe = document.createElement('div');
          probe.style.cssText = 'position:fixed;top:0;left:0;height:env(safe-area-inset-top, 0px);visibility:hidden;pointer-events:none;z-index:-1;';
          document.documentElement.appendChild(probe);
          var h = probe.offsetHeight;
          probe.remove();
          if (h > 0) return h;
        } catch (_) {}

        if (window.visualViewport && window.visualViewport.offsetTop > 0) {
          return window.visualViewport.offsetTop;
        }

        var screenH = Math.max(window.screen.width || 0, window.screen.height || 0);
        if (screenH >= 852) return 54; // Dynamic Island (iPhone 14 Pro / 15 / 16)
        if (screenH >= 812) return 47; // Notch (iPhone X / 11 / 12 / 13 / 14)
        return 20; // Home button
      }

      var statusBarHeight = getStatusBarHeight();
      var isSynced = false;

      // 2. スワイプ（指移動 > 10px）のみで正規化完了と判定
      function markSynced() {
        if (!isSynced) {
          isSynced = true;
          console.log('✅ [Kendo OS Touch Sync] ユーザーのスワイプを検知。WebKitネイティブ座標系が正規化されたため補正を解除しました。');
        }
      }

      var touchStartX = null;
      var touchStartY = null;

      window.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length > 0) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { capture: true, passive: true });

      window.addEventListener('touchmove', function (e) {
        if (touchStartY !== null && e.touches && e.touches.length > 0) {
          var dy = Math.abs(e.touches[0].clientY - touchStartY);
          var dx = Math.abs(e.touches[0].clientX - touchStartX);
          if (dy > 10 || dx > 10) {
            markSynced();
          }
        }
      }, { capture: true, passive: true });

      // 3. ネイティブプロトタイプgetterを退避（多重減算の完全防止）
      var nativeClientY = MouseEvent.prototype ? 
                          Object.getOwnPropertyDescriptor(MouseEvent.prototype, 'clientY').get : null;
      var nativePageY = MouseEvent.prototype ? 
                        Object.getOwnPropertyDescriptor(MouseEvent.prototype, 'pageY').get : null;

      var pointerEvents = [
        'pointerdown', 'pointerup', 'pointermove',
        'touchstart', 'touchend', 'touchmove',
        'mousedown', 'mouseup', 'click'
      ];

      function patchEvent(e) {
        if (!e) return;
        if (isSynced || statusBarHeight <= 0) return;

        // WebKit ネイティブの真の raw 値を取得
        var rawY = nativeClientY ? nativeClientY.call(e) : e.clientY;
        var fixedY = rawY - statusBarHeight;

        try {
          Object.defineProperty(e, 'clientY', {
            get: function () { return isSynced ? rawY : fixedY; },
            configurable: true
          });
          Object.defineProperty(e, 'pageY', {
            get: function () { return isSynced ? (nativePageY ? nativePageY.call(e) : e.pageY) : fixedY; },
            configurable: true
          });
          Object.defineProperty(e, 'offsetY', {
            get: function () { return isSynced ? e.offsetY : fixedY; },
            configurable: true
          });
        } catch (_) {}
      }

      for (var i = 0; i < pointerEvents.length; i++) {
        window.addEventListener(pointerEvents[i], patchEvent, { capture: true, passive: true });
      }

      // 4. 🛡️ Flutter Web の FullPageEmbeddingStrategy が viewport-fit=cover を剥奪するのを常時阻止
      function restoreViewportFit() {
        var metas = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          var c = metas[i].getAttribute('content') || '';
          if (!c.includes('viewport-fit=cover')) {
            metas[i].setAttribute('content', c + ', viewport-fit=cover');
          }
        }
      }
      try {
        var observer = new MutationObserver(function () {
          restoreViewportFit();
        });
        observer.observe(document.head, { childList: true, subtree: true, attributes: true });
        restoreViewportFit();
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // 🔔 iOS/Safari PWAユーザー主導アクション用通知許可ダイアログ起動ヘルパー
    window.requestNotificationPermission = function () {
      console.log('🔔 [Web JS] requestNotificationPermission triggered by user gesture.');
      if ('Notification' in window) {
        Notification.requestPermission().then(function (permission) {
          console.log('🔔 [Web JS] Notification permission result:', permission);
        }).catch(function (err) {
          console.error('⚠️ [Web JS] Notification permission request error:', err);
        });
      } else {
        console.warn('⚠️ [Web JS] Notifications not supported in this browser.');
      }
    };

    // =========================================================================
    // 🛡️ Phase 3 - STEP 3-2 要件：Service Workerアセットキャッシュの強化
    // アプリのコア（JS、フォント、アイコン）は完全ローカルキャッシュしオフライン起動を保証。
    // 重量データであるPDF、画像、およびFirestoreの動的クエリパケットの混入はブラウザクラッシュを防ぐため厳格に禁止。
    // =========================================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=5', {
          scope: '.'
        }).then(function (reg) {
          console.log('🛡️ [PWA ServiceWorker] 体育館オフライン防衛アセットキャッシュが有効です。');
          // 🌟 起動時にService Workerの強制更新を走らせ、古いキャッシュを安全にパージ
          reg.update();
        }).catch(function (err) {
          console.error('⚠️ [PWA ServiceWorker] 登録失敗:', err);
        });
      });
    }

    // 🛡️ キャッシュバスター：古いService Workerおよびキャッシュストレージの確実なパージ
    if ('caches' in window) {
      caches.keys().then(function (names) {
        for (var i = 0; i < names.length; i++) {
          if (names[i].indexOf('v5') === -1) {
            caches.delete(names[i]);
          }
        }
      });
    }
  </script>
  <script>
    // 🛡️ Web レンダラーを CanvasKit で完全統一（PWA / Mobile Safari でのタッチ座標ズレを根絶）
    window.flutterConfiguration = {
      renderer: "canvaskit"
    };
  </script>
  <!-- ★ 修正: 絶対パスに変更し、深いURLからでも確実にロードできるようにする（ホワイトアウト対策4） -->
  <script src="/flutter_bootstrap.js" async></script>
</body>
</html>
