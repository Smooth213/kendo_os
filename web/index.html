<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kendo OS - 次世代武道大会運営システム">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <script src="https://unpkg.com/isar@3.0.0-dev.14/dist/index.js"></script>

  <!-- 🌐 【Phase 7】Safari & Chrome 2大ブラウザ極限最適化スタイル -->
  <style>
    html, body {
      height: 100%;
      height: 100dvh; /* Mobile Safari / Chrome アドレスバー伸縮対応 */
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior-y: none; /* Safari オーバースクロールバウンス完全防止 */
      touch-action: manipulation; /* 連打操作時の誤ズームを完全遮断 */
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      background-color: #000000;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kendo OS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kendo OS</title>
  <link rel="manifest" href="manifest.json">
  <!-- Syncfusion Flutter PDF Viewer for Web (Updated to 3.11.174 to match plugin v28) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    var pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 🌐 【Phase 7】IndexedDB 永続化保護（Safari 7日間データ消滅対策）
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(function (persistent) {
        console.log('💾 [StorageManager] IndexedDB 永続化保護:', persistent);
      });
    }

    // 🌐 【Phase 7】Chrome / Safari BFCache（戻る・進むキャッシュ）復帰最適化
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        console.log('🔄 [BFCache] ページキャッシュから瞬時復帰しました。');
      }
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // 🔔 iOS/Safari PWAユーザー主導アクション用通知許可ダイアログ起動ヘルパー
    window.requestNotificationPermission = function () {
      console.log('🔔 [Web JS] requestNotificationPermission triggered by user gesture.');
      if ('Notification' in window) {
        Notification.requestPermission().then(function (permission) {
          console.log('🔔 [Web JS] Notification permission result:', permission);
        }).catch(function (err) {
          console.error('⚠️ [Web JS] Notification permission request error:', err);
        });
      } else {
        console.warn('⚠️ [Web JS] Notifications not supported in this browser.');
      }
    };

    // =========================================================================
    // 🛡️ Phase 3 - STEP 3-2 要件：Service Workerアセットキャッシュの強化
    // アプリのコア（JS、フォント、アイコン）は完全ローカルキャッシュしオフライン起動を保証。
    // 重量データであるPDF、画像、およびFirestoreの動的クエリパケットの混入はブラウザクラッシュを防ぐため厳格に禁止。
    // =========================================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=1', {
          scope: '.'
        }).then(function (reg) {
          console.log('🛡️ [PWA ServiceWorker] 体育館オフライン防衛アセットキャッシュが有効です。');
        }).catch(function (err) {
          console.error('⚠️ [PWA ServiceWorker] 登録失敗:', err);
        });
      });
    }
  </script>
  <script>
    // 🛡️ Web レンダラーの自動切り替え設定を明示的に強制 (モバイル: HTML, PC: CanvasKit)
    window.flutterConfiguration = {
      renderer: "auto"
    };
  </script>
  <!-- ★ 修正: 絶対パスに変更し、深いURLからでも確実にロードできるようにする（ホワイトアウト対策4） -->
  <script src="/flutter_bootstrap.js" async></script>
</body>
</html>
