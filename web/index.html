<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kendo OS - 次世代武道大会運営システム">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <script src="https://unpkg.com/isar@3.0.0-dev.14/dist/index.js"></script>

  <!-- 🌐 iOS PWA 最適化スタイル：物理固定・エッジ・トゥ・エッジ（chin gap根絶）およびスクロールの絶対封殺 -->
  <style>
    html,
    body,
    flutter-view,
    flt-glass-pane {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      /* 🛡️ WebKit black-translucent chin gap (~59px) 物理根絶処方: 100%を完全排除し100vhで物理拘束 */
      height: 100vh !important;
      min-height: 100vh !important;
      height: 100dvh;
      height: -webkit-fill-available;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: auto;
      touch-action: manipulation;
      /* 連打操作時の誤ズームを完全遮断 */
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      background-color: #F2F2F7;
    }
    @media (prefers-color-scheme: dark) {
      html,
      body,
      flutter-view,
      flt-glass-pane {
        background-color: #000000;
      }
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 🛡️ iOS PWA エッジ・トゥ・エッジ全画面モード：下部黒バーを撤廃し、Safe Area は Flutter 側で自動制御 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Kendo OS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Kendo OS</title>
  <link rel="manifest" href="manifest.json">
  <!-- Syncfusion Flutter PDF Viewer for Web (Updated to 3.11.174 to match plugin v28) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    var pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 🌐 【Phase 7】IndexedDB 永続化保護（Safari 7日間データ消滅対策）
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(function (persistent) {
        console.log('💾 [StorageManager] IndexedDB 永続化保護:', persistent);
      });
    }

    // 🌐 【Phase 7】Chrome / Safari BFCache（戻る・進むキャッシュ）復帰最適化
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        console.log('🔄 [BFCache] ページキャッシュから瞬時復帰しました。');
      }
    });

    // =========================================================================
    // 🛡️ Kendo OS: iOS PWA WebKit 起動直後タッチ座標ズレ 完全物理根絶システム (v4.0 Perfect Snap / v4.1 ScrollLock)
    //
    // 【真因と解決メカニズム】
    // 1. WebKit PWA起動時、内部で window.scrollY=54px スクロールが発生し、画面全体が上に跳ね上がり
    //    最上部がステータスバーに潜り込み、最下部に黒い帯が露出する。
    // 2. CSSの position: fixed と resetScroll() により window.scrollTo(0, 0) を常時強制同期し、
    //    画面の物理位置を原点(0, 0)に完全ロックする。
    // 3. 同時に、イベントの offsetX / offsetY を真の物理要素内座標（clientX - rect.left）に完全スナップする。
    // =========================================================================
    (function () {
      var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      // 🛡️ 1. WebKit による勝手なスクロール（scrollY > 0）を物理封殺
      function resetScroll() {
        if (typeof window.scrollTo === 'function' && (window.scrollY !== 0 || window.scrollX !== 0)) {
          window.scrollTo(0, 0);
        }
        if (document.documentElement && document.documentElement.scrollTop !== 0) {
          document.documentElement.scrollTop = 0;
        }
        if (document.body && document.body.scrollTop !== 0) {
          document.body.scrollTop = 0;
        }
      }

      // 🛡️ 2. セーフエリアとアプリ背景色の完全一体化（カラー動的注入 & meta theme-color 同期）
      window.setThemeColor = function (colorHex) {
        if (!colorHex) return;
        if (document.documentElement) document.documentElement.style.backgroundColor = colorHex;
        if (document.body) document.body.style.backgroundColor = colorHex;
        var views = document.querySelectorAll('flutter-view, flt-glass-pane');
        for (var vi = 0; vi < views.length; vi++) {
          views[vi].style.backgroundColor = colorHex;
        }
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var mi = 0; mi < metas.length; mi++) {
          metas[mi].setAttribute('content', colorHex);
        }
      };

      window.setThemeMode = function (isDark) {
        window.setThemeColor(isDark ? '#000000' : '#F2F2F7');
      };

      window.addEventListener('scroll', resetScroll, { passive: true });
      window.addEventListener('resize', resetScroll, { passive: true });
      window.addEventListener('orientationchange', resetScroll, { passive: true });
      for (var t = 0; t <= 3000; t += 100) {
        setTimeout(resetScroll, t);
      }
      setInterval(resetScroll, 500);

      if (!isIos) return; // 以下iOS固有のタッチスナップ処理

      var pointerEvents = [
        'pointerdown', 'pointerup', 'pointermove', 'pointercancel',
        'touchstart', 'touchend', 'touchmove', 'touchcancel',
        'mousedown', 'mouseup', 'click'
      ];

      function patchEvent(e) {
        resetScroll();
        if (!e) return;
        var clientX = (e.clientX !== undefined && e.clientX !== null)
          ? e.clientX
          : (e.touches && e.touches[0] ? e.touches[0].clientX : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : null));
        var clientY = (e.clientY !== undefined && e.clientY !== null)
          ? e.clientY
          : (e.touches && e.touches[0] ? e.touches[0].clientY : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientY : null));
        if (clientX === null || clientY === null) return;

        var target = e.target || document.documentElement;
        var rect = (target && typeof target.getBoundingClientRect === 'function')
          ? target.getBoundingClientRect()
          : { left: 0, top: 0 };

        var expectedX = clientX - rect.left;
        var expectedY = clientY - rect.top;

        try {
          Object.defineProperty(e, 'offsetX', {
            get: function () { return expectedX; },
            configurable: true
          });
          Object.defineProperty(e, 'offsetY', {
            get: function () { return expectedY; },
            configurable: true
          });
        } catch (_) { }
      }

      for (var i = 0; i < pointerEvents.length; i++) {
        window.addEventListener(pointerEvents[i], patchEvent, { capture: true, passive: true });
      }

      // 🛡️ Flutter Web の FullPageEmbeddingStrategy が viewport-fit=cover を剥奪するのを常時阻止
      function restoreViewportFit() {
        var metas = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          var c = metas[i].getAttribute('content') || '';
          if (!c.includes('viewport-fit=cover')) {
            metas[i].setAttribute('content', c + ', viewport-fit=cover');
          }
        }
      }
      try {
        var observer = new MutationObserver(function () {
          restoreViewportFit();
        });
        observer.observe(document.head, { childList: true, subtree: true, attributes: true });
        restoreViewportFit();
      } catch (_) { }
    })();
  </script>
</head>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // 🔔 iOS/Safari PWAユーザー主導アクション用通知許可ダイアログ起動ヘルパー
    window.requestNotificationPermission = function () {
      console.log('🔔 [Web JS] requestNotificationPermission triggered by user gesture.');
      if ('Notification' in window) {
        Notification.requestPermission().then(function (permission) {
          console.log('🔔 [Web JS] Notification permission result:', permission);
        }).catch(function (err) {
          console.error('⚠️ [Web JS] Notification permission request error:', err);
        });
      } else {
        console.warn('⚠️ [Web JS] Notifications not supported in this browser.');
      }
    };

    // =========================================================================
    // 🛡️ Phase 3 - STEP 3-2 要件：Service Workerアセットキャッシュの強化
    // アプリのコア（JS、フォント、アイコン）は完全ローカルキャッシュしオフライン起動を保証。
    // 重量データであるPDF、画像、およびFirestoreの動的クエリパケットの混入はブラウザクラッシュを防ぐため厳格に禁止。
    // =========================================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=13', {
          scope: '.'
        }).then(function (reg) {
          console.log('🛡️ [PWA ServiceWorker] 体育館オフライン防衛アセットキャッシュが有効です。');
          // 🌟 起動時にService Workerの強制更新を走らせ、古いキャッシュを安全にパージ
          reg.update();
        }).catch(function (err) {
          console.error('⚠️ [PWA ServiceWorker] 登録失敗:', err);
        });
      });
    }

    // 🛡️ キャッシュバスター：古いService Workerおよびキャッシュストレージの確実なパージ
    if ('caches' in window) {
      caches.keys().then(function (names) {
        for (var i = 0; i < names.length; i++) {
          if (names[i].indexOf('v13') === -1) {
            caches.delete(names[i]);
          }
        }
      });
    }
  </script>
  <script>
    // 🛡️ Web レンダラーを CanvasKit で完全統一（PWA / Mobile Safari でのタッチ座標ズレを根絶）
    window.flutterConfiguration = {
      renderer: "canvaskit"
    };
  </script>
  <!-- ★ 修正: 絶対パスに変更し、深いURLからでも確実にロードできるようにする（ホワイトアウト対策4） -->
  <script src="/flutter_bootstrap.js" async></script>
</body>

</html>
