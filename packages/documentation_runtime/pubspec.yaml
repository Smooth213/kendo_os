name: documentation_runtime
description: "Isolated documentation runtime package for kendo_os."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.9.0

flutter:
  assets:
    - manuals/
    - manuals/operator/
    - manuals/viewer/
    - manuals/recovery/
    - manuals/quickstart/
    - manuals/faq/
